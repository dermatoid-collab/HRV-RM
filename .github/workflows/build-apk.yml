name: Build debug APK

on:
  push:
    branches:
      - claude/android-hrv-intervals-app-7mhaum
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set build info
        id: build_info
        run: echo "date=$(date +%d%m%y)" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon -PbuildNumber=${{ github.run_number }} -PbuildDate=${{ steps.build_info.outputs.date }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hrv-rm_debug_build${{ github.run_number }}_${{ steps.build_info.outputs.date }}
          path: app/build/outputs/apk/debug/*.apk
